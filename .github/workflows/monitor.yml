name: ITMO Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache data file
        uses: actions/cache@v4
        with:
          path: itmo_data.json
          key: itmo-data-${{ github.run_id }}
          restore-keys: |
            itmo-data-
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run monitor
        run: python itmo-monit/monitor.py   # <--- ИЗМЕНЕНО: добавил путь к папке
